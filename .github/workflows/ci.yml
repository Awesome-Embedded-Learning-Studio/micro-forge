name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC-14 + ARM toolchain
        run: |
          sudo apt-get update
          # gcc-arm-none-eabi: builds the Cortex-M3 test firmware (hello/blink/
          # systick) so test_e2e/test_cli/INTROSPECTION_HELLO_ELF configure and
          # the test-count floor gate reaches its baseline on this workflow.
          sudo apt-get install -y g++-14 gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps/googletest-src
          key: googletest-v1.14.0-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 60 -j "$(nproc)"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/Testing/
