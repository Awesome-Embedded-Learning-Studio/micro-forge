# gcovr.cfg — micro-forge coverage report defaults (COVERAGE-METHODOLOGY §2).
# ============================================================================
# One-liner (from project root, after activating the project venv):
#   source scripts/use-python.sh && gcovr
#
# Prerequisites — build a coverage tree once, then re-run after changes:
#   cmake -B build-cov -S . -DMICRO_FORGE_COVERAGE=ON
#   cmake --build build-cov -j$(nproc)
#   ctest --test-dir build-cov        # runs the tests, flushes .gcda at exit
#
# Only the micro_forge library is instrumented (gtest/test drivers are not), so
# gcovr reports src/ coverage with no _deps noise. Defaults (this file):
#   * text table to stdout — line metric, with uncovered line numbers per file
#     (the actionable view for coverage hunting)
#   * a 3-metric summary — lines / functions / branches
# Overrides:
#   gcovr --txt-metric branch                 # text table on branches instead
#   gcovr --html build-cov/coverage.html --html-details   # browsable HTML report
root = .
print-summary = yes
